<!doctype html>
<html lang="id" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BankFlash - Modern Banking Dashboard & Manajemen Terpadu" />
    <title>BankFlash - Modern Banking Dashboard</title>
    <!-- Modern Inter Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Tailwind Script for CDN compatibility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bank: {
                primary: '#4338F5',
                primaryHover: '#3730E8',
                secondary: '#6366F1',
                bg: '#F4F5FA',
                card: '#FFFFFF',
                textMain: '#20243A',
                textMuted: '#9298AA',
                success: '#24C9A0',
                danger: '#F16D83',
                border: '#ECEEF4',
                cyan: '#16DBCC',
                orange: '#FC7900',
                magenta: '#FA00FF',
              },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      /* Compiled Tailwind Dark Classes */
      .dark .dark\:bg-gray-800 { background-color: #1A2035; }
      .dark .dark\:bg-gray-900 { background-color: #121626; }
      .dark .dark\:border-gray-700 { border-color: #252D47; }
      .dark .dark\:border-gray-800 { border-color: #1E2640; }
      .dark .dark\:text-white { color: #FFFFFF; }
      .dark .dark\:text-gray-100 { color: #F8FAFC; }
      .dark .dark\:text-gray-300 { color: #CBD5E1; }
      .dark .dark\:text-gray-400 { color: #94A3B8; }
    </style>
  </head>
  <body class="bg-[#F4F5FA] dark:bg-[#121626] text-[#20243A] dark:text-[#F8FAFC] antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
